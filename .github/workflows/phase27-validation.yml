name: Phase27 HDR 实际函数验证
on:
  push:
    branches: [codex/phase27-validation]
    paths:
      - 'tools/phase27/**'
      - '.github/workflows/phase27-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hdr-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: 重建真实 FFmpeg SEI 对象并运行本轮回归
        run: python3 -B tools/phase27/runner.py --out "${{ runner.temp }}/phase27-ci"
      - name: 上传允许列表文本证据和完整索引
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase27-hdr-regression
          path: ${{ runner.temp }}/phase27-ci/artifact/
          include-hidden-files: true
          if-no-files-found: error
