name: Phase31 normal playback host validation
on:
  push:
    branches: [codex/phase28-validation]
    paths: ['tools/phase31-normal-validation/**', '.github/workflows/phase31-normal-validation.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Replay exact normal app and offline gate inputs
        run: python3 -B tools/phase31-normal-validation/runner.py --out "$RUNNER_TEMP/phase31-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase31-normal-validation-${{ github.sha }}
          path: ${{ runner.temp }}/phase31-evidence/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
