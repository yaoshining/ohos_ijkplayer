name: FFmpeg OHCodec producer 门禁

on:
  workflow_dispatch:
  push:
    paths: ['tools/ffmpeg8/**', 'tools/speckit/**', '.specify/**', 'specs/001-ffmpeg-ohcodec-producer/**', '.github/workflows/build-ffmpeg8.yml']
  pull_request:
    paths: ['tools/ffmpeg8/**', 'tools/speckit/**', '.specify/**', 'specs/001-ffmpeg-ohcodec-producer/**', '.github/workflows/build-ffmpeg8.yml']

env:
  SPECIFY_FEATURE_DIRECTORY: specs/001-ffmpeg-ohcodec-producer

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Spec Kit 工件前置检查
        run: .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks --include-tasks
      - name: 正常、边界、失败路径回归
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/ffmpeg8/tests -p 'test_*.py' -v
          bash tools/ffmpeg8/tests/test-sdk-contract.sh
          bash -n tools/ffmpeg8/ci-build-ohcodec.sh tools/ffmpeg8/build-ohcodec.sh tools/ffmpeg8/build-libsmbclient.sh

  ohcodec-source-producer:
    needs: contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: 固定宿主镜像并执行源码闭包验证
        id: validate
        run: bash tools/ffmpeg8/ci-container.sh
      - name: 保留诊断 SDK 与证据（不代表正式发布）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohcodec-diagnostics-not-release
          path: |
            out/ci-ohcodec/*.log
            out/ci-ohcodec/*.json
            out/ci-ohcodec/inputs/input-verification.json
            out/ci-ohcodec/clean-*/work/prefix/
            out/ci-container/*.json
            out/ci-container/*.sha256
            out/ci-ohcodec/host-provenance/
            out/ci-ohcodec/host-lock.json
            out/ci-ohcodec/dependencies/*/build.log
            out/ci-ohcodec/dependencies/*/work/**/configure.log
            out/ci-ohcodec/dependencies/*/work/**/config.log
            out/ci-ohcodec/dependencies/*/build-record.json
            out/ci-ohcodec/dependencies/*/sysroot/dependency-manifest*.json
            out/ci-ohcodec/dependencies/*/sysroot/new-source-closure.json
            out/ci-ohcodec/dependencies/*/sysroot/lib/*.a
            !out/ci-ohcodec/dependencies/*/sysroot/lib/liby.a
            out/ci-ohcodec/dependencies/*/sysroot/lib/pkgconfig/
            out/ci-ohcodec/dependencies/*/sysroot/include/
            out/ci-ohcodec/dependencies/*/sysroot/evidence/
            out/ci-ohcodec/dependencies/*/sysroot/licenses/
          if-no-files-found: warn
          retention-days: 14
      - name: 正式 SDK（只有所有门禁通过才允许）
        if: success() && steps.validate.outputs.formal_artifact_allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ohcodec-source-sdk-verified
          path: out/ci-ohcodec/clean-a/work/prefix/
          if-no-files-found: error
          retention-days: 14
