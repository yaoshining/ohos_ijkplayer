name: PR3 完整宿主契约
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        case: ['21', '22', '23', '24', '26', '27', '28', 'parent', '29', '30', '31']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 门禁自身真实成功失败回归
        run: python3 -B tools/pr3-gates/test_gate.py
      - name: 执行精确合并源码契约
        run: python3 -B tools/pr3-gates/gate.py --case '${{ matrix.case }}' --out "$RUNNER_TEMP/pr3-${{ matrix.case }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr3-contract-${{ matrix.case }}
          path: ${{ runner.temp }}/pr3-${{ matrix.case }}/artifact/
          if-no-files-found: error
          retention-days: 30
  required:
    if: always()
    needs: contracts
    runs-on: ubuntu-22.04
    steps:
      - name: 全矩阵必须成功
        env:
          RESULT: ${{ needs.contracts.result }}
        run: test "$RESULT" = success
