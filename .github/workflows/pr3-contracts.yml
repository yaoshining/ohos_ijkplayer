name: PR3 完整宿主契约
on:
  pull_request:
  push:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        case: ['21', '22', '23', '24', '26', '27', '28', 'parent', '29', '30', '31']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装 Phase21 宿主 libavutil 测试依赖
        if: matrix.case == '21'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr3-host-21"
          sudo apt-get update > "$RUNNER_TEMP/pr3-host-21/apt-update.log" 2>&1
          sudo apt-get install -y --no-install-recommends pkg-config libavutil-dev > "$RUNNER_TEMP/pr3-host-21/apt-install.log" 2>&1
          dpkg-query -W -f='${binary:Package}\t${Version}\t${Architecture}\n' pkg-config libavutil-dev 'libavutil[0-9]*' > "$RUNNER_TEMP/pr3-host-21/packages.txt"
          pkg-config --modversion libavutil > "$RUNNER_TEMP/pr3-host-21/pkg-version.txt"
          pkg-config --cflags --libs libavutil > "$RUNNER_TEMP/pr3-host-21/pkg-flags.txt"
          libdir="$(pkg-config --variable=libdir libavutil)"
          pcdir="$(pkg-config --variable=pcfiledir libavutil)"
          sha256sum "$(readlink -f "$libdir/libavutil.so")" "$pcdir/libavutil.pc" > "$RUNNER_TEMP/pr3-host-21/files.sha256"
          id > "$RUNNER_TEMP/pr3-host-21/test-user.txt"
          printf '%s\n' '仅Ubuntu宿主测试依赖，不代表目标FFmpeg8来源。' > "$RUNNER_TEMP/pr3-host-21/scope.txt"
      - name: 核对宿主工具
        run: |
          clang --version
          clang++ --version
          make --version
          git --version
          node --version
          npm --version
      - name: 门禁自身真实成功失败回归
        run: python3 -B tools/pr3-gates/test_gate.py
      - name: 执行精确合并源码契约
        run: python3 -B tools/pr3-gates/gate.py --case '${{ matrix.case }}' --out "$RUNNER_TEMP/pr3-${{ matrix.case }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr3-contract-${{ matrix.case }}
          path: ${{ runner.temp }}/pr3-${{ matrix.case }}/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: 保存 Phase21 宿主依赖身份
        if: always() && matrix.case == '21'
        uses: actions/upload-artifact@v4
        with:
          name: pr3-host-dependencies-21
          path: ${{ runner.temp }}/pr3-host-21/
          if-no-files-found: error
          retention-days: 30
  required:
    if: always()
    needs: contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: pr3-contract-*
          path: ${{ runner.temp }}/pr3-matrix
      - name: 核验完整矩阵及制品索引
        run: python3 -B tools/pr3-gates/gate.py --aggregate "$RUNNER_TEMP/pr3-matrix" --out "$RUNNER_TEMP/pr3-result.json"
      - name: 全矩阵必须成功
        env:
          RESULT: ${{ needs.contracts.result }}
        run: test "$RESULT" = success
