name: PR1 producer真实宿主门禁
on:
  workflow_dispatch:
  pull_request:
    paths: ["tools/pr1-gates/**", "specs/002-pr1-ci-gates/**", ".github/workflows/pr1-contracts.yml", "tools/ffmpeg8/**", "tools/hx509-history/**", "tools/cross-root-profile/**", "tools/lexer-source-profile/**", "tools/phase17/**", ".github/workflows/build-ffmpeg8.yml", ".github/workflows/phase17-mpv-repro.yml", ".github/workflows/phase12-lexer-source.yml"]
  merge_group:
  push:
    branches: [master, codex/docs-pr1-speckit-closeout]
    paths: ["tools/pr1-gates/**", "specs/002-pr1-ci-gates/**", ".github/workflows/pr1-contracts.yml", "tools/ffmpeg8/**", "tools/hx509-history/**", "tools/cross-root-profile/**", "tools/lexer-source-profile/**", "tools/phase17/**", ".github/workflows/build-ffmpeg8.yml", ".github/workflows/phase17-mpv-repro.yml", ".github/workflows/phase12-lexer-source.yml"]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 固定工作流解析工具
        run: python3 -m pip install PyYAML==6.0.1
      - name: 执行实际宿主回归和失败门禁
        run: python3 -B tools/pr1-gates/run.py --out "${{ runner.temp }}/pr1-host-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1-host-not-release
          path: ${{ runner.temp }}/pr1-host-evidence/artifact/
          if-no-files-found: error
          retention-days: 14
